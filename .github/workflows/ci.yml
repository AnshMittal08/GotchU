name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.6.9
      - run: ruff check .

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: windows-latest          # GotchU is a Windows tool; the vault tests need Windows' encryption
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Unit tests
        run: python -m unittest -v

      - name: PowerShell scripts parse without errors
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem gotchu -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors) { $failed = $true; $errors | ForEach-Object { Write-Host "$($_.Extent.File):$($_.Extent.StartLineNumber) $($_.Message)" } }
          }
          if ($failed) { exit 1 }

      - name: Data files are valid JSON
        run: python -c "import json; json.load(open('gotchu/secrets_map.json', encoding='utf-8'))"

      - name: Installs as a package and the command runs
        shell: pwsh
        run: |
          python -m pip install .
          Set-Location $env:RUNNER_TEMP    # so the installed copy is used, not the checkout
          gotchu --version
          python -c "from importlib.resources import files; from gotchu import admin; [(files('gotchu') / n).read_bytes() for n in ('app.html', 'gotchu.ico', 'fonts/barlow-500.woff2', 'secrets_map.json', 'harden.ps1', 'collect.ps1', 'browse.ps1', *admin.HELPERS)]"
